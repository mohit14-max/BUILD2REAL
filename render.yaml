services:
  - type: web
    runtime: static
    name: build2real
    buildCommand: 'true'
    staticPublishPath: ./benchtwin.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
